name: Dependency Updates

on:
  schedule:
    # Run every 2-3 days, without a month-boundary reset.
    - cron: '0 9 * * 1,3,5'
  workflow_dispatch:
    inputs:
      dry_run:
        description: >-
          Run checks and dependency updates without creating/updating GitHub
          issues or opening a dependency update pull request.
        type: boolean
        default: false
      bypass_cooldown:
        description: >-
          Bypass the 7-day dependency cooldown for a reviewed urgent security
          fix. Applies to all dependency updates in this run.
        type: boolean
        default: false

env:
  UV_VERSION: "0.12.7"

jobs:
  major-version-indicator:
    name: Dependency Release Indicators
    runs-on: ubuntu-latest
    permissions:
      issues: write

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.14"

    - name: Install pinned uv for release checks
      run: |
        curl -LsSf "https://astral.sh/uv/$UV_VERSION/install.sh" | sh
        echo "$HOME/.cargo/bin" >> $GITHUB_PATH

    - name: Report uv release availability
      run: |
        python scripts/check_uv_version.py \
          --pinned-version "$UV_VERSION" \
          --summary-file "$RUNNER_TEMP/uv-version.md"
        cat "$RUNNER_TEMP/uv-version.md" >> "$GITHUB_STEP_SUMMARY"

    - name: Report newer major versions
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        GITHUB_SERVER_URL: ${{ github.server_url }}
        GITHUB_RUN_ID: ${{ github.run_id }}
      run: |
        DRY_RUN_ARGS=()
        if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
          DRY_RUN_ARGS=(--dry-run)
          echo "**Dry run:** GitHub issue sync was skipped." >> "$GITHUB_STEP_SUMMARY"
        fi
        uv run --frozen python scripts/manage_major_version_indicator_issue.py \
          --summary-dir "$RUNNER_TEMP" \
          "${DRY_RUN_ARGS[@]}"
        if [ -f "$RUNNER_TEMP/major-versions.md" ]; then
          cat "$RUNNER_TEMP/major-versions.md" >> "$GITHUB_STEP_SUMMARY"
        else
          echo "All direct runtime dependencies are on the latest major version." >> "$GITHUB_STEP_SUMMARY"
        fi
        if [ -f "$RUNNER_TEMP/inspector-major.md" ]; then
          cat "$RUNNER_TEMP/inspector-major.md" >> "$GITHUB_STEP_SUMMARY"
        else
          echo "MCP Inspector is on the latest major version." >> "$GITHUB_STEP_SUMMARY"
        fi

  update-dependencies:
    name: Update Dependencies
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
    - uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.14"

    - name: Install uv
      run: |
        curl -LsSf "https://astral.sh/uv/$UV_VERSION/install.sh" | sh
        echo "$HOME/.cargo/bin" >> $GITHUB_PATH

    - name: Set dependency publication cutoff
      id: cooldown
      env:
        BYPASS_COOLDOWN: ${{ github.event_name == 'workflow_dispatch' && inputs.bypass_cooldown == true }}
      run: |
        if [[ "$BYPASS_COOLDOWN" == "true" ]]; then
          echo "::warning::Dependency cooldown explicitly bypassed for this run"
          echo "policy=Bypassed for a reviewed urgent security fix" >> "$GITHUB_OUTPUT"
          echo "**Warning:** dependency cooldown explicitly bypassed for this run." >> "$GITHUB_STEP_SUMMARY"
        else
          CUTOFF="$(date -u -d '7 days ago' '+%Y-%m-%dT%H:%M:%SZ')"
          echo "UV_EXCLUDE_NEWER=$CUTOFF" >> "$GITHUB_ENV"
          echo "policy=7 days; publication cutoff $CUTOFF" >> "$GITHUB_OUTPUT"
          echo "**Dependency cooldown:** 7 days. Shared Python/Inspector publication cutoff: $CUTOFF." >> "$GITHUB_STEP_SUMMARY"
        fi

    - name: Update dependencies
      run: |
        uv lock --upgrade

    - name: Install Node.js for MCP Inspector
      uses: actions/setup-node@v7
      with:
        node-version: '24'

    - name: Update MCP Inspector lock (minor/patch within constraint)
      run: |
        if [[ -n "${UV_EXCLUDE_NEWER:-}" ]]; then
          python scripts/update_inspector_version.py --exclude-newer "$UV_EXCLUDE_NEWER" --npm-lock
        else
          python scripts/update_inspector_version.py --cooldown-days 0 --npm-lock
        fi

    - name: Run tests to ensure updates don't break anything
      run: make test

    - name: Install system dependencies for e2e
      run: |
        sudo apt-get update
        sudo apt-get install -y curl jq openssl

    - name: Run e2e tests with emulator
      run: |
        echo "## E2E tests" >> "$GITHUB_STEP_SUMMARY"
        echo "Default remains **stdio**. HTTP MCP auth e2e covers lab mode, local JWT, local HTTPS introspection hardening, OAuth Proxy and OIDC Proxy against CNCF Dex, OIDC Proxy metadata against a loopback OpenID simulator, and strict Host/Origin middleware. Cloud IdPs are not in CI." >> "$GITHUB_STEP_SUMMARY"
        make e2e

    - name: Check emulator logs on failure
      if: failure()
      run: |
        echo "=== Emulator Logs ==="
        make e2e-emulator-logs || echo "No logs available"
        echo "=== Dex Logs ==="
        make e2e-dex-logs || echo "No Dex logs available"

    - name: Cleanup e2e environment
      if: always()
      run: |
        make e2e-emulator-stop || true
        make e2e-dex-stop || true

    - name: Report dependency changes (dry run)
      if: github.event_name == 'workflow_dispatch' && inputs.dry_run == true
      run: |
        echo "**Dry run:** dependency updates and tests completed; PR creation skipped." >> "$GITHUB_STEP_SUMMARY"
        if git diff --quiet uv.lock e2e/inspector-version.lock e2e/package.json e2e/package-lock.json; then
          echo "No lockfile changes." >> "$GITHUB_STEP_SUMMARY"
        else
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          git diff --stat uv.lock e2e/inspector-version.lock e2e/package.json e2e/package-lock.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
        fi

    - name: Create Pull Request
      id: create-pr
      if: github.event_name != 'workflow_dispatch' || inputs.dry_run != true
      uses: peter-evans/create-pull-request@v5
      with:
        # To enable automatic CI triggers:
        # 1. Create a PAT with 'repo' scope in GitHub Settings
        # 2. Add it as repository secret named 'PAT_TOKEN'
        # 3. Change the line below to: token: ${{ secrets.PAT_TOKEN }}
        # Currently using GITHUB_TOKEN (CI workflows may not trigger automatically)
        token: ${{ secrets.GITHUB_TOKEN }}
        commit-message: "chore: update dependencies"
        title: "Automated dependency updates"
        body: |
          This PR contains automated dependency updates.

          - Python dependencies are updated in `uv.lock` and Inspector plus its transitive npm graph in `e2e/package-lock.json`, using the seven-day cutoff
          - Actions and container image updates are tracked by Renovate's Dependency Update Dashboard, with the same age policy
          - Dependency cooldown: ${{ steps.cooldown.outputs.policy }}
          - The Dependency updates available issue is refreshed with latest and eligible major versions, uv status, and Dex release status
          - Unit tests and e2e tests (including MCP Inspector integration) pass
          - Please review the changes and merge if everything looks good

          ⚠️ **Note**: CI/CD workflows may not run automatically on this PR because it was created using GITHUB_TOKEN.
          If the CI checks don't appear, please close and reopen this PR to trigger them manually.

          Generated by GitHub Actions.
        branch: dependency-updates
        delete-branch: true
        add-paths: |
          uv.lock
          e2e/inspector-version.lock
          e2e/package.json
          e2e/package-lock.json
